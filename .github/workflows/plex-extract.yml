name: plex-extract

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:         # manual run button

permissions:
  contents: write

concurrency:
  group: plex-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install requests

      - name: Generate playlist + EPG
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u plex_extract.py --region clt --days 1 --gz -o playlists

      - name: Sanity check
        run: |
          test -s playlists/playlist.m3u
          n=$(grep -o "<programme " playlists/epg.xml | wc -l)
          echo "programmes: $n"
          test "$n" -ge 5000

      - name: Commit playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -qm "plex extract $(date -u +%F-%H%M)"
          git push
