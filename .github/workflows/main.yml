name: plex-extract

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:         # manual run button

permissions:
  contents: write

concurrency:
  group: plex-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install requests

      - name: Generate playlist + EPG
        run: python plex_extract.py --days 3 --gz -o out

      - name: Sanity check
        run: |
          test -s out/playlist.m3u
          test -s out/epg.xml
          grep -c "<programme " out/epg.xml

      - name: Publish to data branch
        working-directory: out
        run: |
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "plex extract $(date -u +%F-%H%M)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

